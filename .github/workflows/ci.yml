name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aluno
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: backend_camadas
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U aluno -d backend_camadas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.4-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: labs/backend-layers/package-lock.json

      - name: Validate course content
        run: node scripts/validate-content.js

      - name: Install lab dependencies
        working-directory: labs/backend-layers
        run: npm ci

      - name: Run unit tests
        working-directory: labs/backend-layers
        run: npm test

      - name: Test Redis-backed HTTP rate limiter
        working-directory: labs/backend-layers
        env:
          RUN_REDIS_INTEGRATION: '1'
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

      - name: Configure disposable PostgreSQL connection
        working-directory: labs/backend-layers
        shell: bash
        run: |
          cat > .env <<'EOF'
          PGHOST=127.0.0.1
          PGPORT=55433
          PGUSER=aluno
          PGDATABASE=backend_camadas
          PGPASSWORD=ci-only-password
          EOF

      - name: Check database connection
        working-directory: labs/backend-layers
        run: npm run db:check

      - name: Apply database migrations
        working-directory: labs/backend-layers
        run: npm run migrate

      - name: Run PostgreSQL integration test
        working-directory: labs/backend-layers
        env:
          RUN_PG_INTEGRATION: '1'
        run: npm run test:db

      - name: Test compatibility with the previous application version
        working-directory: labs/backend-layers
        env:
          RUN_MIGRATION_COMPATIBILITY: '1'
        run: npm run test:migration-compatibility

      - name: Test cache-aside with PostgreSQL and Redis
        working-directory: labs/backend-layers
        env:
          RUN_CACHE_INTEGRATION: '1'
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:cache

      - name: Install headless Chromium and system dependencies
        working-directory: labs/backend-layers
        run: npx playwright install --with-deps chromium --only-shell

      - name: Run browser flow
        working-directory: labs/backend-layers
        run: npm run test:e2e

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/backend-layers
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: labs/backend-layers/package-lock.json

      - name: Install lab dependencies
        run: npm ci

      - name: Configure disposable PostgreSQL connection
        shell: bash
        run: |
          cat > .env <<'EOF'
          PGHOST=127.0.0.1
          PGPORT=55433
          PGUSER=aluno
          PGDATABASE=backend_camadas
          PGPASSWORD=ci-only-password
          EOF

      - name: Start PostgreSQL with the lab Compose file
        shell: bash
        run: |
          docker compose up -d db
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U aluno -d backend_camadas; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Apply migrations
        run: npm run migrate

      - name: Add fictitious session data for the restore check
        run: docker compose exec -T db psql -v ON_ERROR_STOP=1 -U aluno -d backend_camadas -c "INSERT INTO sessoes_estudo (estudo_id, minutos) VALUES (1, 25);"

      - name: Back up, restore to a new database, and compare both tables
        run: npm run test:backup-restore

      - name: Stop the disposable Compose stack
        if: always()
        continue-on-error: true
        run: docker compose down
