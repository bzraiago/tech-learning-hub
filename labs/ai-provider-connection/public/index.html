<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conexão local com um modelo de IA</title>
  <style>
    :root { color-scheme: light dark; font: 1rem/1.55 system-ui, sans-serif; }
    body { max-width: 46rem; margin: 0 auto; padding: 1.5rem; }
    main { display: grid; gap: 1rem; }
    textarea { box-sizing: border-box; width: 100%; min-height: 9rem; padding: .75rem; font: inherit; }
    button { width: fit-content; padding: .65rem 1rem; font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #70a5ff; outline-offset: 3px; }
    .notice { padding: .75rem; border-inline-start: 4px solid #e3a929; }
    #answer { white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <h1>Conexão local com um modelo de IA</h1>
    <p class="notice">Use perguntas fictícias. Não envie senha, chave, dados pessoais ou informações confidenciais. Esta demonstração funciona só nesta máquina e não está pronta para publicação.</p>
    <form id="chat-form">
      <label for="prompt">Mensagem para o modelo</label>
      <textarea id="prompt" name="prompt" maxlength="1000" required></textarea>
      <button id="send" type="submit">Enviar uma mensagem</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section aria-labelledby="answer-title">
      <h2 id="answer-title">Resposta</h2>
      <p id="answer"></p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const promptField = document.querySelector('#prompt');
    const sendButton = document.querySelector('#send');
    const status = document.querySelector('#status');
    const answer = document.querySelector('#answer');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      sendButton.disabled = true;
      status.textContent = 'Enviando uma única solicitação…';
      answer.textContent = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptField.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Não foi possível obter resposta.');
        answer.textContent = result.text;
        status.textContent = 'Resposta recebida do serviço configurado.';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
