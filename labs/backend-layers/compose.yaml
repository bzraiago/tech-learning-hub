name: techhub-backend-layers
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PGUSER:?Defina PGUSER no arquivo .env}
      POSTGRES_DB: ${PGDATABASE:?Defina PGDATABASE no arquivo .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Defina PGPASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${PGPORT:-55433}:5432"
    volumes:
      - backend-layers-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-aluno} -d ${PGDATABASE:-backend_camadas}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.8.4-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  backend-layers-dados:
